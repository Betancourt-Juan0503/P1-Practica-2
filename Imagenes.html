<!DOCTYPE html> <!-- Le dice al navegador que es una página HTML5 moderna -->
<html lang="es"> <!-- Inicio de la página web y en idioma español -->

<head> <!-- Información interna para el navegador que no se ve en pantalla -->
    <meta charset="UTF-8"> <!-- Se usa para mostrar acentos y la letra ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adapta la pagina para que se vea bien en celulares -->
    <title>Imagenes en htmlL</title> <!-- Titulo que aparece en la pestaña del navegador -->
</head> <!-- Cierra la parte de la informacion interna de la pagina -->

<body> <!-- Inicia la parque que contiene informacion visible de la pagina -->
    <h2>Imagenes en HTML</h2> <!-- Agrega un subtitulo -->
    <h3>Locales</h3> <!-- Agrega otro ssubtitulo de menor tamaño -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Permite insertar una imagen que esta descargada en el dispositivo -->
    <h3>Locales redismensionado</h3> <!-- Agrega otro subtitulo de menor tamaño -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Permite agregar una imagen -->
    <h3>Desde internet</h3>  <!-- Agrega otro subtitulo  -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""> <!-- Agrega una imagen desde un enlace en un sitio web y ajusta el tamano de la misma -->
    <h3>Animaciones</h3> <!-- Agrega un subtitulo -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!-- Agrega una imagen desde el enclace de un sitio web y ajusta el tamaño de la mimsa-->
</body> <!-- Cierra la parte que contiene la informacion visible de la pagina -->
</html> <!-- Cierra el codigo de la pagina web -->
