    <!-- 
        COMENTARIO ACERCA DE LOS ENLACES:
        La etiqueta <a> (anchor) se utiliza para crear hipervínculos hacia otras páginas del mismo sitio 
        o hacia sitios web externos mediante el atributo "href". 
        El atributo "target" especifica en dónde se abrirá el recurso enlazado:
        - "_self": Abre el enlace en la misma ventana o pestaña (comportamiento por defecto).
        - "_blank": Abre el enlace en una nueva ventana o pestaña del navegador.
        - "_parent": Abre el enlace en el marco padre (utilizado en estructuras con frames o iframes).
        - "_top": Abre el enlace cancelando todos los marcos y ocupando el cuerpo completo de la ventana.
    -->

    <h2>Tipos de enlaces en HTML</h2>
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>

</body>

</html>
